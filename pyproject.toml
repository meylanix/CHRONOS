[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos-history"
version = "0.2.0"
description = "CHRONOS: traceable historical data, honest backtesting and conditional scenarios"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "requests>=2.31",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "plotly>=5.20"]
vdem = ["pyreadr>=0.5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-requests"]
all = ["chronos-history[ui,vdem,dev]"]

[project.scripts]
chronos = "chronos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chronos = ["storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs outbound internet access (set CHRONOS_NETWORK_TESTS=1 to run)",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["chronos"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
