# Civilization State Model: indicator catalogue.
# Each entry is looked up in the database; if absent the model reports NO DATA with the
# command that would load it. Nothing is ever filled in from memory.
#
# kind = "series"   : a stored series (indicator/source/entity)
# kind = "popweight": population-weighted world mean of a country-level indicator
#                     (weights: OWID population, joined by ISO3); coverage is reported
# kind = "popshare" : share of world population living in countries where indicator >= threshold
# kind = "fact"     : documented point estimates from the knowledge graph (tag)

[[indicator]]
domain = "economy"
key = "world_gdp"
label = "World GDP (Maddison Project Database 2023, via OWID)"
kind = "series"
indicator = "gdp"
source = "owid"
entity = "World"
change_window = 10

[[indicator]]
domain = "economy"
key = "world_gdp_pc"
label = "World GDP per capita (CHRONOS-derived: OWID gdp / population)"
kind = "series"
indicator = "gdp_per_capita"
source = "owid"
entity = "World"
change_window = 10

[[indicator]]
domain = "energy"
key = "primary_energy"
label = "World primary energy consumption"
kind = "series"
indicator = "primary_energy_consumption"
source = "owid"
entity = "World"
change_window = 10

[[indicator]]
domain = "energy"
key = "energy_pc"
label = "Primary energy per person"
kind = "series"
indicator = "energy_per_capita"
source = "owid"
entity = "World"
change_window = 10

[[indicator]]
domain = "energy"
key = "low_carbon_share"
label = "Low-carbon share of primary energy"
kind = "series"
indicator = "low_carbon_share_energy"
source = "owid"
entity = "World"
change_window = 10

[[indicator]]
domain = "energy"
key = "fossil_share"
label = "Fossil share of primary energy"
kind = "series"
indicator = "fossil_share_energy"
source = "owid"
entity = "World"
change_window = 10

[[indicator]]
domain = "technology_ai"
key = "internet_users_wb"
label = "Individuals using the Internet, % of population (World Bank WDI)"
kind = "series"
indicator = "IT.NET.USER.ZS"
source = "worldbank"
entity = "World"
load_hint = "chronos fetch worldbank --indicator IT.NET.USER.ZS --country WLD"

[[indicator]]
domain = "technology_ai"
key = "internet_ai_facts"
label = "Documented point estimates: internet and generative-AI adoption"
kind = "fact"
tags = ["transition:internet", "transition:genai"]
load_hint = "chronos kg import data/curated/tech_transitions.json"

[[indicator]]
domain = "demography"
key = "world_population"
